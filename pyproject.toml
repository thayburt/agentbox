[project]
name = "agentbox"
version = "0.1.0"
description = "Run AI coding agents inside rootless Podman containers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentbox = "agentbox.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["E501"]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]
